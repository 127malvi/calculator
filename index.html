<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body onload="storage()">

<div id="calc_body">
    <div id="user_input">
        <p>Input: </p>
        <input id="entered" type="text">
    </div>
    <div id="output">
        <p>Output: </p>
        <p id="result"> </p>
    </div>
    <div id="numpad">
        <button id="1" class="nums"> 1 </button>
        <button id="2" class="nums"> 2 </button>
        <button id="3" class="nums"> 3 </button>
        <button id="4" class="nums"> 4 </button>
        <button id="5" class="nums"> 5 </button>
        <button id="6" class="nums"> 6 </button>
        <button id="7" class="nums"> 7 </button>
        <button id="8" class="nums"> 8 </button>
        <button id="9" class="nums"> 9 </button>
        <button class="nums">   </button>
        <button id="0" class="nums"> 0 </button>
        <button class="nums">   </button>
    </div>
    <div id="all_ops">
        <div id="op_pad">
            <button id="plus"> + </button>
            <button id="minus"> - </button>
            <button id="mod"> % </button>
            <button id="pow"> ^ </button>
            <button id="divide"> / </button>
            <button id="multiply"> X </button>
            <button id="open_par"> ( </button>
            <button id="close_par"> ) </button>
            <button id="dot"> . </button>
        </div>
        <button id="evaluate"> = </button>
    </div>
    <div id="up/down">
        <button id="up">  UP </button>
        <button id="down"> DOWN </button>
    </div>

</div>

<script src="index.js"></script>
</body>
</html>
