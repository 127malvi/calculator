<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body>

<div id="calc_body">
    <div id="user_input">
        <p>Input: </p>
        <input id="entered" type="text">
    </div>
    <div id="output">
        <p>Output: </p>
        <p id="result"> </p>
    </div>
    <div id="numpad">
        <div id="1"> 1 </div>
        <div id="2"> 2 </div>
        <div id="3"> 3 </div>
        <div id="4"> 4 </div>
        <div id="5"> 5 </div>
        <div id="6"> 6 </div>
        <div id="7"> 7 </div>
        <div id="8"> 8 </div>
        <div id="9"> 9 </div>
        <div>   </div>
        <div id="0"> 0 </div>
        <div>   </div>
    </div>
    <div id="all_ops">
        <div id="op_pad">
            <div id="plus"> + </div>
            <div id="minus"> - </div>
            <div id="mod"> % </div>
            <div id="pow"> ^ </div>
            <div id="divide"> / </div>
            <div id="multiply"> X </div>
            <div id="open_par"> ( </div>
            <div id="close_par"> ) </div>
            <div id="dot"> . </div>
        </div>
        <div id="evaluate"> = </div>
    </div>
    <div id="up/down">
        <div id="up">  UP </div>
        <div id="down"> DOWN </div>
    </div>
